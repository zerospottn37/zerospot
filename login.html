<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroSpot — Customer Sign In &amp; Register</title>
  <meta name="description" content="Sign in or register to book and track zero-advance cleaning and facility services with ZeroSpot.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function () {
      var w = console.warn;
      console.warn = function () {
        if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('cdn.tailwindcss.com') !== -1) return;
        w.apply(console, arguments);
      };
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at center, rgba(14, 15, 12, 0.6) 0%, rgba(14, 15, 12, 0.88) 100%),
                  url('assets/adminbg.png') center/cover no-repeat fixed;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient noise/grid grain */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 20%, rgba(184, 255, 85, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Architectural ultra-transparent frosted glass */
    .glass-card {
      background: rgba(14, 15, 12, 0.32);
      backdrop-filter: blur(36px) saturate(190%);
      -webkit-backdrop-filter: blur(36px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 35px 80px -15px rgba(0, 0, 0, 0.6),
                  inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transition: all 0.25s ease;
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.09);
      border-color: #b8ff55;
      box-shadow: 0 0 0 3px rgba(184, 255, 85, 0.18);
    }

    .glass-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .btn-lime {
      background: #b8ff55;
      color: #0e0f0c;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-lime:hover {
      background: #cbff7a;
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -6px rgba(184, 255, 85, 0.35);
    }

    .btn-lime:active {
      transform: translateY(0);
    }

    .btn-lime:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-glass-google {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-glass-google:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px -5px rgba(0, 0, 0, 0.4);
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(14, 15, 12, 0.25);
      border-top-color: #0e0f0c;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading .spinner {
      display: inline-block;
    }

    .loading .btn-text {
      opacity: 0.8;
    }
  </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">

  <!-- TOP MINIMAL NAVIGATION BAR -->
  <header class="relative z-10 w-full max-w-6xl mx-auto flex items-center justify-between">
    <!-- Brand -->
    <a href="index.html" class="flex items-center gap-2 group">
      <span class="font-['Outfit'] font-black text-xl tracking-tight text-white group-hover:opacity-90 transition">
        ZERO<span class="text-[#b8ff55]">SPOT</span>
      </span>
    </a>

    <!-- Return Home Link -->
    <a href="https://www.zero-spot.in/"
      class="glass-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold text-white/80 hover:text-white hover:bg-white/10 transition inline-flex items-center gap-1.5 shadow-2xs">
      <svg class="w-3.5 h-3.5 text-white/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      <span>Return to Website</span>
    </a>
  </header>

  <!-- CENTER AUTH CARD (FROSTED GLASS) -->
  <main class="relative z-10 my-auto py-8 flex items-center justify-center">
    <div class="glass-card w-full max-w-[540px] rounded-3xl p-8 sm:p-10">
      
      <!-- Card Header -->
      <div class="mb-6">
        <div class="flex items-center justify-end mb-4">
          <!-- Switcher Pill Button -->
          <button type="button" id="bannerToggleBtn"
            class="glass-pill px-3.5 py-1.5 rounded-xl text-xs font-bold text-white/80 hover:text-[#b8ff55] hover:border-[#b8ff55]/40 transition cursor-pointer inline-flex items-center gap-1.5">
            Create Account
          </button>
        </div>

        <h1 id="pageHeading" class="text-2xl sm:text-[28px] font-black tracking-tight text-white leading-tight">
          Sign In
        </h1>
        <p id="authSubtitle" class="text-xs text-white/60 mt-1.5 font-medium leading-relaxed">
          Enter your email and password to access your bookings and invoices.
        </p>
      </div>

      <!-- Feedback Alert Box -->
      <div id="inlineAlert" class="hidden mb-5 rounded-xl p-3 text-xs font-semibold flex items-center gap-2.5 border" role="alert"></div>

      <!-- Form -->
      <form id="authForm" autocomplete="on" novalidate class="space-y-4">
        
        <!-- Full Name (Hidden in Sign In mode, Shown in Register mode) -->
        <div id="fieldFullName" class="hidden">
          <label for="authName" class="block text-[11px] font-extrabold uppercase tracking-wider text-white/70 mb-1.5">
            Full Name
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-white/40">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </span>
            <input id="authName" type="text" autocomplete="name" placeholder="John Doe"
              class="glass-input w-full pl-10 pr-3.5 py-3 rounded-xl text-sm font-semibold outline-none">
          </div>
        </div>

        <!-- Email -->
        <div id="fieldEmailWrap">
          <label for="authEmail" class="block text-[11px] font-extrabold uppercase tracking-wider text-white/70 mb-1.5">
            Email Address
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-white/40">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
            </span>
            <input id="authEmail" type="email" autocomplete="email" placeholder="you@domain.com" required
              class="glass-input w-full pl-10 pr-3.5 py-3 rounded-xl text-sm font-semibold outline-none">
          </div>
        </div>

        <!-- Password -->
        <div id="fieldPasswordWrap">
          <div class="flex items-center justify-between mb-1.5">
            <label for="authPassword" class="block text-[11px] font-extrabold uppercase tracking-wider text-white/70">
              Password
            </label>
            <button type="button" id="togglePasswordBtn" class="text-[11px] font-bold text-[#b8ff55] hover:underline cursor-pointer">
              Show
            </button>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-white/40">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </span>
            <input id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••••••" required
              class="glass-input w-full pl-10 pr-3.5 py-3 rounded-xl text-sm font-semibold outline-none">
          </div>
        </div>

        <!-- Forgot Password Link -->
        <div id="forgotPwWrap" class="text-right">
          <a href="#" id="forgotPwLink" class="text-xs text-white/60 hover:text-[#b8ff55] transition-colors">
            Forgot password?
          </a>
        </div>

        <!-- Primary Action Submit Button -->
        <button id="mainSubmitBtn" type="submit"
          class="btn-lime w-full mt-2 py-3.5 px-4 rounded-xl font-['Outfit'] font-black text-xs uppercase tracking-wider cursor-pointer shadow-sm flex items-center justify-center gap-2">
          <div class="spinner"></div>
          <span class="btn-text" id="submitBtnText">SIGN IN</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>

        <!-- Google Sign In Divider -->
        <div id="googleBtnWrap" class="pt-2">
          <div class="w-full flex items-center justify-center gap-3 my-2">
            <div class="h-px bg-white/10 flex-1"></div>
            <span class="text-[11px] font-semibold text-white/40 uppercase tracking-wider">or</span>
            <div class="h-px bg-white/10 flex-1"></div>
          </div>

          <button type="button" id="googleSignInBtn" onclick="handleSocialStub('Google')"
            class="btn-glass-google w-full py-3 px-4 rounded-xl text-xs font-bold flex items-center justify-center gap-2.5 cursor-pointer">
            <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
        </div>

      </form>
    </div>
  </main>

  <!-- BOTTOM FOOTER -->
  <footer class="relative z-10 w-full max-w-6xl mx-auto text-center text-[11px] text-white/40 pb-2">
    &copy; 2026 ZeroSpot Facility Services Pvt Ltd &bull; Pudukkottai &amp; Coimbatore
  </footer>

  <script src="cookie-manager.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

    // Firebase Web Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC1iV5uNsYRdK_q8nrNqCMZJfB54UKn45A",
      authDomain: "zerospot-ea705.firebaseapp.com",
      projectId: "zerospot-ea705",
      storageBucket: "zerospot-ea705.firebasestorage.app",
      messagingSenderId: "716557257470",
      appId: "1:716557257470:web:cc905e3ce7735257e433af",
      measurementId: "G-2DR48BQTCM"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const googleProvider = new GoogleAuthProvider();

    const getApiBase = () => {
      if (window.ZS_API_BASE) return window.ZS_API_BASE;
      try {
        const stored = localStorage.getItem("zs_api_base");
        if (stored) return stored;
      } catch (e) {}
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
      if (!isLocalhost) return '';
      if (window.location.port === '4000' || window.location.port === '3000') return '';
      return 'http://localhost:4000';
    };

    const API_BASE = getApiBase();

    /* State */
    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get("redirect") || "";
    let viewAction = "signin";

    /* Elements */
    const pageHeading = document.getElementById("pageHeading");
    const authSubtitle = document.getElementById("authSubtitle");
    const bannerToggleBtn = document.getElementById("bannerToggleBtn");
    const submitBtnText = document.getElementById("submitBtnText");
    const mainSubmitBtn = document.getElementById("mainSubmitBtn");
    const authForm = document.getElementById("authForm");
    const fieldFullName = document.getElementById("fieldFullName");
    const forgotPwWrap = document.getElementById("forgotPwWrap");
    const forgotPwLink = document.getElementById("forgotPwLink");
    const inlineAlert = document.getElementById("inlineAlert");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const authName = document.getElementById("authName");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");

    // Toggle password visibility
    if (togglePasswordBtn && authPassword) {
      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = authPassword.type === "password";
        authPassword.type = isPassword ? "text" : "password";
        togglePasswordBtn.textContent = isPassword ? "Hide" : "Show";
      });
    }

    // Switch Sign In / Sign Up
    bannerToggleBtn.addEventListener("click", toggleActionState);

    function toggleActionState() {
      viewAction = viewAction === "signin" ? "signup" : "signin";
      applyViewAction(viewAction);
    }

    function applyViewAction(action) {
      clearAlert();

      if (action === "signin") {
        pageHeading.textContent = "Sign In";
        authSubtitle.textContent = "Enter your email and password to access your bookings and invoices.";
        submitBtnText.textContent = "SIGN IN";
        bannerToggleBtn.textContent = "Create Account";
        fieldFullName.classList.add("hidden");
        forgotPwWrap.classList.remove("hidden");
      } else {
        pageHeading.textContent = "Create Account";
        authSubtitle.textContent = "Enter your name, email and password to register a new ZeroSpot account.";
        submitBtnText.textContent = "SIGN UP";
        bannerToggleBtn.textContent = "Sign In Instead";
        fieldFullName.classList.remove("hidden");
        forgotPwWrap.classList.add("hidden");
      }
    }

    // Initialize state
    applyViewAction(viewAction);

    // Check existing session
    try {
      const existingUser = window.ZS_Auth ? window.ZS_Auth.getUser() : null;
      if (existingUser && redirectTo) {
        showAlert(`Welcome back, ${existingUser.name || 'Friend'}! Redirecting…`, "success");
        setTimeout(() => redirect("customer"), 700);
      }
    } catch (e) {}

    /* Register */
    async function registerUser(name, email, password) {
      const response = await fetch(`${API_BASE}/api/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password, phone: "" })
      });
      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.message || "Unable to create account.");
      }
      return data;
    }

    /* Login */
    async function loginUser(email, password) {
      const response = await fetch(`${API_BASE}/api/auth/login-email`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.message || "Invalid email or password.");
      }
      return data;
    }

    /* Form Submit */
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();

      const email = authEmail.value.trim().toLowerCase();
      const password = authPassword.value;

      if (!email || !password) {
        showAlert("Please enter your email and password.", "error");
        return;
      }

      if (viewAction === "signup" && password.length < 6) {
        showAlert("Password must be at least 6 characters.", "error");
        return;
      }

      if (viewAction === "signup" && !authName.value.trim()) {
        showAlert("Please enter your full name.", "error");
        authName.focus();
        return;
      }

      setLoading(true);

      try {
        if (viewAction === "signup") {
          const name = authName.value.trim();
          const data = await registerUser(name, email, password);

          sessionStorage.setItem("zs_mode", "customer");
          const userPayload = JSON.stringify({
            uid: data.uid,
            name: name,
            email: email,
            phone: "",
            role: "customer"
          });

          if (window.ZS_Auth) {
            window.ZS_Auth.saveSession(userPayload, data.token);
          } else {
            sessionStorage.setItem("zs_user", userPayload);
            localStorage.setItem("zs_user", userPayload);
          }

          if (data.token) sessionStorage.setItem("zs_custom_token", data.token);
          if (data.idToken) {
            sessionStorage.setItem("zs_id_token", data.idToken);
            localStorage.setItem("zs_id_token", data.idToken);
          }
          if (data.refreshToken) sessionStorage.setItem("zs_refresh_token", data.refreshToken);

          showAlert("Account created successfully! Redirecting…", "success");
          setTimeout(() => redirect("customer"), 700);
          return;
        }

        // SIGN IN
        const data = await loginUser(email, password);

        sessionStorage.setItem("zs_mode", "customer");
        const userPayload = JSON.stringify({
          uid: data.uid,
          name: data.name || "",
          email: data.email || email,
          phone: data.phone || "",
          role: data.role || "customer"
        });

        if (window.ZS_Auth) {
          window.ZS_Auth.saveSession(userPayload, data.idToken);
        } else {
          sessionStorage.setItem("zs_user", userPayload);
          localStorage.setItem("zs_user", userPayload);
        }

        if (data.idToken) sessionStorage.setItem("zs_id_token", data.idToken);
        if (data.refreshToken) sessionStorage.setItem("zs_refresh_token", data.refreshToken);

        showAlert("Signed in successfully! Redirecting…", "success");
        setTimeout(() => redirect(data.role || "customer"), 700);

      } catch (error) {
        console.error("[ZeroSpot Auth Error]", error);
        showAlert(error.message || "Authentication failed. Please try again.", "error");
        setLoading(false);
      }
    });

    /* Forgot Password */
    forgotPwLink.addEventListener("click", async (e) => {
      e.preventDefault();
      const email = authEmail.value.trim().toLowerCase();
      if (!email) {
        showAlert("Please enter your email above to reset your password.", "error");
        authEmail.focus();
        return;
      }
      showAlert("Password reset link will be sent to your registered email.", "success");
    });

    /* Google Sign In */
    window.handleSocialStub = async function(provider) {
      if (provider !== "Google") return;
      clearAlert();
      setLoading(true);

      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        const idToken = await user.getIdToken();

        const response = await fetch(`${API_BASE}/api/auth/google`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken })
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.message || "Google authentication failed.");
        }

        sessionStorage.setItem("zs_mode", "customer");
        const googleUserPayload = JSON.stringify({
          uid: data.uid,
          name: data.name || user.displayName || "",
          email: data.email || user.email || "",
          phone: data.phone || user.phoneNumber || "",
          role: data.role || "customer"
        });

        if (window.ZS_Auth) {
          window.ZS_Auth.saveSession(googleUserPayload, data.idToken);
        } else {
          sessionStorage.setItem("zs_user", googleUserPayload);
          localStorage.setItem("zs_user", googleUserPayload);
        }

        sessionStorage.setItem("zs_id_token", data.idToken);
        showAlert("Google sign in successful! Redirecting…", "success");
        setTimeout(() => redirect("customer"), 700);

      } catch (error) {
        console.error("GOOGLE LOGIN ERROR:", error);
        let message = "Unable to sign in with Google.";
        if (error.code === "auth/popup-closed-by-user") {
          message = "Google sign in was cancelled.";
        } else if (error.code === "auth/popup-blocked") {
          message = "Your browser blocked the Google sign-in popup. Please allow popups for this site.";
        } else if (error.code === "auth/unauthorized-domain") {
          const currentHost = window.location.hostname || "current domain";
          message = `Domain "${currentHost}" is not authorized in Firebase. Add it under Firebase Console > Authentication > Settings > Authorized domains (or use http://localhost).`;
        } else if (error.message) {
          message = error.message;
        }
        showAlert(message, "error");
        setLoading(false);
      }
    };

    /* Redirect */
    function redirect(mode) {
      let destination = mode === "partner" ? "partner-app.html" : "index.html";
      if (redirectTo) {
        if (redirectTo === "book" || redirectTo === "appointment") {
          destination = "appointment.html";
        } else {
          destination = decodeURIComponent(redirectTo);
        }
      }
      window.location.href = destination;
    }

    /* Loading state */
    function setLoading(isLoading) {
      mainSubmitBtn.classList.toggle("loading", isLoading);
      mainSubmitBtn.disabled = isLoading;
    }

    /* Alerts */
    function showAlert(text, type) {
      inlineAlert.innerHTML = `
        <svg class="w-4 h-4 ${type === 'error' ? 'text-rose-400' : 'text-[#b8ff55]'} shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          ${type === 'error'
            ? '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
            : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>'
          }
        </svg>
        <span>${escapeHTML(text)}</span>
      `;

      inlineAlert.className = `mb-5 rounded-xl p-3 text-xs font-semibold flex items-center gap-2.5 border ${
        type === 'error'
          ? 'bg-rose-950/60 border-rose-500/40 text-rose-200'
          : 'bg-[#0e0f0c]/90 border-[#b8ff55]/40 text-[#b8ff55]'
      }`;
      inlineAlert.classList.remove("hidden");
    }

    function clearAlert() {
      inlineAlert.innerHTML = "";
      inlineAlert.classList.add("hidden");
    }

    function escapeHTML(str) {
      return String(str || "").replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
