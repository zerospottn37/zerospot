# ==============================================================================
# Zero Spot — Production Nginx Configuration
# Domains: zero-spot.in, www.zero-spot.in, admin.zero-spot.in
# ==============================================================================

# 1. UPSTREAM BACKEND NODE.JS SERVER
upstream zerospot_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# 2. MAIN CUSTOMER WEBSITE: www.zero-spot.in & zero-spot.in
server {
    listen 80;
    listen [::]:80;
    server_name zero-spot.in www.zero-spot.in;

    # SSL (Certbot will configure these lines automatically)
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/zero-spot.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/zero-spot.in/privkey.pem;

    root /var/www/zero-spot/Website;
    index index.html;

    # Redirect /page.html to clean URL /page
    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    # Clean URL handling (strips .html extension)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Explicit Clean Route Aliases
    location = /appointment {
        try_files /appointment.html =404;
    }
    location = /book {
        try_files /appointment.html =404;
    }
    location = /login {
        try_files /login.html =404;
    }
    location = /customer {
        try_files /customer-app.html =404;
    }
    location = /partner {
        try_files /partner-app.html =404;
    }
    location = /pay {
        try_files /pay.html =404;
    }

    # Reverse Proxy API calls to Node.js Backend Server (Port 4000)
    location /api/ {
        proxy_pass http://zerospot_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Static Asset Caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

# 3. ADMIN OPERATIONS PORTAL: admin.zero-spot.in
server {
    listen 80;
    listen [::]:80;
    server_name admin.zero-spot.in;

    # SSL (Certbot will configure these lines automatically)
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/admin.zero-spot.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.zero-spot.in/privkey.pem;

    root /var/www/zero-spot/Website;

    # Root of admin.zero-spot.in directly serves admin.html
    location = / {
        try_files /admin.html =404;
    }

    # Clean Login for Admin: admin.zero-spot.in/login serves admin-login.html
    location = /login {
        try_files /admin-login.html =404;
    }
    location = /admin-login {
        try_files /admin-login.html =404;
    }
    location = /admin {
        try_files /admin.html =404;
    }

    # Redirect /page.html to /page
    if ($request_uri ~ ^/(.*)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    # Clean URL handling
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Reverse Proxy API calls to Node.js Backend Server (Port 4000)
    location /api/ {
        proxy_pass http://zerospot_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Static Asset Caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
