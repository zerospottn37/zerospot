<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroSpot Partner App</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0f172a; --muted:#64748b; --line:#dbe4ef; --brand:#075cf8; --ok:#059669; --warn:#d97706; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Plus Jakarta Sans",sans-serif; background:#eef2f7; color:var(--ink); }
    header { background:#07111f; color:white; position:sticky; top:0; z-index:4; }
    .bar { max-width:1180px; margin:0 auto; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:14px; }
    .brand { font-family:Outfit,sans-serif; font-size:22px; font-weight:900; display:flex; align-items:center; gap:10px; }
    .brand img { width:38px; height:38px; object-fit:contain; }
    button, .btn { border:0; border-radius:8px; padding:13px 16px; font-size:15px; font-weight:900; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    .primary { background:var(--brand); color:#fff; }
    .ok { background:var(--ok); color:#fff; width:100%; font-size:20px; padding:18px; }
    .ghost { background:#1e293b; color:#fff; }
    main { max-width:1180px; margin:0 auto; padding:24px 20px 60px; }
    .hero { background:#fff; border:1px solid var(--line); border-radius:8px; padding:22px; margin-bottom:18px; }
    h1 { margin:0; font-family:Outfit,sans-serif; font-size:clamp(32px,6vw,56px); line-height:1; letter-spacing:0; }
    .muted { color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
    .task { background:white; border:2px solid #cbd5e1; border-radius:8px; padding:18px; box-shadow:0 16px 36px rgba(15,23,42,.08); display:flex; flex-direction:column; gap:16px; }
    .task.urgent { border-color:#60a5fa; }
    .status { width:max-content; border-radius:999px; padding:7px 11px; font-size:13px; font-weight:900; text-transform:uppercase; background:#e0e7ff; color:#3730a3; }
    .customer { background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:16px; }
    .customer h2 { margin:0 0 8px; font-family:Outfit,sans-serif; font-size:34px; line-height:1.05; }
    .big { font-size:22px; font-weight:900; line-height:1.25; }
    .box { border:1px solid var(--line); background:#f8fafc; border-radius:8px; padding:14px; }
    .label { display:block; color:#64748b; font-size:12px; font-weight:900; text-transform:uppercase; margin-bottom:5px; }
    .split { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .empty, .error { background:#fff; border:1px solid var(--line); border-radius:8px; padding:28px; text-align:center; }
    .error { color:#991b1b; display:none; margin-bottom:16px; }
    textarea { width:100%; min-height:72px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit; }
    @media (max-width:720px) { .bar { flex-direction:column; align-items:flex-start; } .split, .actions { grid-template-columns:1fr; } .customer h2 { font-size:30px; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand"><img src="assets/logo-transparent.png" alt="">ZeroSpot Partner App</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="ghost" id="refreshBtn">Refresh</button>
        <button class="ghost" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="muted" id="partnerWelcome">Partner dashboard</p>
      <h1>Assigned service tasks</h1>
      <p class="muted">Customer details are shown in large field-readable containers. Mark completion here so admin can review and issue invoice.</p>
    </section>

    <div class="error" id="errorBox"></div>
    <div class="grid" id="tasksGrid"></div>
  </main>

  <script src="cookie-manager.js"></script>
  <script>
    const getApiBase = () => {
      if (window.ZS_API_BASE) return window.ZS_API_BASE;
      try {
        const stored = localStorage.getItem("zs_api_base");
        if (stored) return stored;
      } catch (e) {}
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
      if (!isLocalhost) return '';
      if (window.location.port === '4000' || window.location.port === '3000') return '';
      return 'http://localhost:4000';
    };
    const API_BASE = getApiBase();
    const grid = document.getElementById("tasksGrid");
    const errorBox = document.getElementById("errorBox");

    function getToken() {
      return (window.ZS_Auth && window.ZS_Auth.getToken && window.ZS_Auth.getToken())
        || sessionStorage.getItem("zs_id_token")
        || localStorage.getItem("zs_id_token")
        || "";
    }

    function getUser() {
      return (window.ZS_Auth && window.ZS_Auth.getUser && window.ZS_Auth.getUser())
        || JSON.parse(sessionStorage.getItem("zs_user") || localStorage.getItem("zs_user") || "null");
    }

    function escapeHTML(value) {
      return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    function render(tasks) {
      if (!tasks.length) {
        grid.innerHTML = `<div class="empty"><h2>No assigned tasks</h2><p class="muted">When admin assigns a confirmed service to you, it will appear here automatically.</p></div>`;
        return;
      }

      grid.innerHTML = tasks.map(task => {
        const complete = task.status === "completed";
        return `
          <article class="task ${complete ? "" : "urgent"}">
            <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">
              <div>
                <span class="label">Booking</span>
                <div class="big">#${escapeHTML(task.bookingId || task.documentId)}</div>
              </div>
              <span class="status">${escapeHTML((task.status || "").replaceAll("_"," "))}</span>
            </div>

            <section class="customer">
              <span class="label">Customer</span>
              <h2>${escapeHTML(task.name || task.customerName || "Customer")}</h2>
              <div class="big">${escapeHTML(task.phone || task.customerPhone || "")}</div>
            </section>

            <div class="box">
              <span class="label">Address</span>
              <div class="big">${escapeHTML(task.address || "")}</div>
              <p class="muted">${escapeHTML(task.location || "")}</p>
            </div>

            <div class="box">
              <span class="label">Service</span>
              <div class="big">${escapeHTML(task.serviceSummary || task.serviceTitle || task.service || "Service")}</div>
              ${task.notes ? `<p class="muted">${escapeHTML(task.notes)}</p>` : ""}
            </div>

            <div class="split">
              <div class="box"><span class="label">Date</span><div class="big">${escapeHTML(task.date || "Today")}</div></div>
              <div class="box"><span class="label">Time</span><div class="big">${escapeHTML(task.timeSlot || "Flexible")}</div></div>
            </div>

            <div class="actions">
              <a class="btn primary" href="tel:${escapeHTML(task.phone || task.customerPhone || "")}">Call Customer</a>
              <a class="btn primary" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(task.address || task.location || "")}" target="_blank">Open Map</a>
            </div>

            ${complete ? `<div class="box"><span class="label">Completed</span><div class="big">Waiting for admin invoice confirmation</div></div>` : `
              <textarea id="notes-${escapeHTML(task.documentId)}" placeholder="Completion notes, materials used, final observations"></textarea>
              <button class="ok" data-complete="${escapeHTML(task.documentId)}">Mark Service Completed</button>
            `}
          </article>
        `;
      }).join("");

      document.querySelectorAll("[data-complete]").forEach(btn => {
        btn.addEventListener("click", () => completeTask(btn.dataset.complete));
      });
    }

    async function loadTasks() {
      const token = getToken();
      const user = getUser();
      if (!token || !user) {
        location.replace("login.html?redirect=partner-app.html");
        return;
      }
      document.getElementById("partnerWelcome").textContent = `Signed in as ${user.name || user.email || "partner"}`;

      try {
        const response = await fetch(`${API_BASE}/api/partner/bookings`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.success) throw new Error(result.message || "Could not load assigned tasks.");
        render(result.data || result.bookings || []);
        errorBox.style.display = "none";
      } catch (error) {
        errorBox.style.display = "block";
        errorBox.textContent = error.message;
      }
    }

    async function completeTask(documentId) {
      const token = getToken();
      const notes = document.getElementById(`notes-${documentId}`)?.value || "";
      try {
        const response = await fetch(`${API_BASE}/api/partner/bookings/${encodeURIComponent(documentId)}/complete`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify({ completionNotes: notes })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.success) throw new Error(result.message || "Could not mark complete.");
        await loadTasks();
      } catch (error) {
        alert(error.message);
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadTasks);
    document.getElementById("logoutBtn").addEventListener("click", () => {
      if (window.ZS_Auth) window.ZS_Auth.clearSession();
      sessionStorage.clear();
      location.replace("login.html");
    });

    loadTasks();
    setInterval(loadTasks, 15000);
  </script>
</body>
</html>
